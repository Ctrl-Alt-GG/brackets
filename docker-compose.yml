networks:
  bracket_lan:
    driver: bridge
    # A fixed subnet, so that the gateway is known: the host's reverse proxy reaches the
    # published ports through it, and the backend trusts its X-Forwarded-For. Pick another
    # private /24 if this one is taken on the host, and change FORWARDED_ALLOW_IPS to match.
    ipam:
      config:
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1

volumes:
  bracket_uploads:

services:
  bracket-backend:
    container_name: bracket-backend
    image: ghcr.io/ctrl-alt-gg/bracket-backend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: PRODUCTION
      BASE_URL: https://bracket.ctrl-alt-gg.hu
      CORS_ORIGINS: https://bracket.ctrl-alt-gg.hu
      PG_DSN: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      API_PREFIX: /api
      # Open tournaments are public, so with this on anyone can publish on the home page.
      # Accounts can always be created with `cli.py register-user`.
      ALLOW_USER_REGISTRATION: ${ALLOW_USER_REGISTRATION:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      # The reverse proxy whose X-Forwarded-For is trusted, so that rate limits count per client:
      # the gateway of bracket_lan above. See "Reverse proxy" in the README.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.240.1}
    healthcheck:
      # Path must include API_PREFIX above.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8400/api/ping')",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    ports:
      - 127.0.0.1:8400:8400
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bracket_uploads:/app/uploads

  bracket-frontend:
    container_name: bracket-frontend
    image: ghcr.io/ctrl-alt-gg/bracket-frontend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    depends_on:
      - bracket-backend
    environment:
      API_BASE_URL: https://bracket.ctrl-alt-gg.hu
    networks:
      - bracket_lan
    ports:
      - 127.0.0.1:3000:8080
    restart: unless-stopped
    read_only: true
    tmpfs:
      # nginx keeps its pid file and buffers under /tmp, where the entrypoint also writes the
      # page's runtime configuration, and it renders the server configuration into conf.d.
      - /tmp:uid=101,gid=101,mode=1777
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql

  redis:
    image: redis:8
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    restart: always
