networks:
  bracket_lan:
    driver: bridge

services:
  bracket-backend:
    container_name: bracket-backend
    image: ghcr.io/ctrl-alt-gg/bracket-backend:v0.1
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: PRODUCTION
      BASE_URL: https://bracket.ctrl-alt-gg.hu
      CORS_ORIGINS: https://bracket.ctrl-alt-gg.hu
      PG_DSN: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      API_PREFIX: /api
      ALLOW_USER_REGISTRATION: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    healthcheck:
      # Path must include API_PREFIX above.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8400/api/ping')",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    ports:
      - 127.0.0.1:8400:8400
    restart: unless-stopped
    volumes:
      - ./backend:/app/static

  bracket-frontend:
    container_name: bracket-frontend
    image: ghcr.io/ctrl-alt-gg/bracket-frontend:v0.1
    depends_on:
      - bracket-backend
    environment:
      API_BASE_URL: https://bracket.ctrl-alt-gg.hu
    networks:
      - bracket_lan
    ports:
      - 127.0.0.1:3000:8080
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
    image: postgres:18
    networks:
      - bracket_lan
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql

  redis:
    image: redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    restart: always
