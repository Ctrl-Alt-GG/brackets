networks:
  bracket_lan:
    driver: bridge

volumes:
  bracket_pg_data:
  bracket_static_data:

services:
  bracket-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bracket-backend
    depends_on:
      - postgres
    environment:
      ENVIRONMENT: DEVELOPMENT
      CORS_ORIGINS: http://localhost:8080
      PG_DSN: postgresql://bracket_dev:bracket_dev@postgres:5432/bracket_dev
      API_PREFIX: /api
    networks:
      - bracket_lan
    ports:
      - 8400:8400
    restart: unless-stopped
    volumes:
      - bracket_static_data:/app/static

  bracket-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bracket-frontend
    depends_on:
      - bracket-backend
    environment:
      API_BASE_URL: http://localhost:8400/api
    networks:
      - bracket_lan
    ports:
      - 8080:8080
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: bracket_dev
      POSTGRES_PASSWORD: bracket_dev
      POSTGRES_USER: bracket_dev
    image: postgres
    networks:
      - bracket_lan
    restart: always
    volumes:
      - bracket_pg_data:/var/lib/postgresql
