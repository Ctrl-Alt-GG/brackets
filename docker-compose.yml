networks:
  bracket_lan:
    driver: bridge

volumes:
  bracket_pg_data:
  bracket_static_data:

services:
  bracket-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bracket-backend
    depends_on:
      - postgres
    environment:
      ENVIRONMENT: DEVELOPMENT
      CORS_ORIGINS: http://localhost:8080
      PG_DSN: postgresql://bracket_dev:bracket_dev@postgres:5432/bracket_dev
      API_PREFIX: /api
      # Local development only - never reuse this value outside compose.
      JWT_SECRET: dev-only-insecure-jwt-secret-change-me-0123456789
    healthcheck:
      # Path must include API_PREFIX above.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8400/api/ping')",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - bracket_lan
    ports:
      - 8400:8400
    restart: unless-stopped
    volumes:
      - bracket_static_data:/app/static

  bracket-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bracket-frontend
    depends_on:
      - bracket-backend
    environment:
      API_BASE_URL: http://localhost:8400/api
    networks:
      - bracket_lan
    ports:
      - 8080:8080
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: bracket_dev
      POSTGRES_PASSWORD: bracket_dev
      POSTGRES_USER: bracket_dev
    image: postgres
    networks:
      - bracket_lan
    restart: always
    volumes:
      - bracket_pg_data:/var/lib/postgresql
