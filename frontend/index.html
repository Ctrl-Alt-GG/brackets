<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ctrl-Alt-GG Bracket</title>
    <meta
      content="Schedules, standings and brackets of Ctrl-Alt-GG tournaments"
      name="description"
    />
    <link rel="shortcut icon" href="/favicon.svg" />
    <style>
      /* Mirrors src/styles.css so the shell is branded before the bundle loads. */
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(221, 37, 37, 0.18), transparent 28%),
          linear-gradient(180deg, #171114 0%, #0c090b 100%);
        color: #f4f4f5;
        font-family: 'Outfit Variable', 'Segoe UI', sans-serif;
      }
      #app-boot {
        display: flex;
        min-height: 60vh;
        align-items: center;
        justify-content: center;
      }
      #app-boot span {
        display: block;
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid rgba(255, 181, 181, 0.3);
        border-top-color: #ff8a8a;
        border-radius: 9999px;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot"><span></span></div>
    </div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
