name: Static checks

on:
  push:
    # A tag is checked by the publish workflow, which calls this one before it builds.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bracket
          POSTGRES_PASSWORD: bracket
          POSTGRES_DB: bracket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username bracket"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: DEVELOPMENT
      JWT_SECRET: only-for-the-tests-and-at-least-32-characters-long
      PG_DSN: postgresql://bracket:bracket@localhost:5432/bracket_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run python -m mypy bracket tests

      - name: Run tests
        # The tests create the tables from the metadata. Stamping the empty database at the latest
        # migration first keeps the app from replaying every migration on top of them at startup.
        run: |
          uv run alembic stamp head
          uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # Its `packageManager` field pins the version.
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: pnpm run typecheck && pnpm run lint && pnpm run format:check

      - name: Run tests
        run: pnpm run test:unit

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser regressions
        run: pnpm run test:browser

      - name: Build
        run: pnpm run build
