name: Publish images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            description: "Bracket backend for the Ctrl-Alt-GG LAN tournament system: FastAPI application with Alembic migrations."
          - component: frontend
            description: "Bracket frontend for the Ctrl-Alt-GG LAN tournament system: React 19 and Vite SPA served by nginx."
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          provenance: mode=max
          annotations: |
            index:org.opencontainers.image.description=${{ matrix.description }}
            manifest:org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            ghcr.io/${{ steps.image.outputs.namespace }}/bracket-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.namespace }}/bracket-${{ matrix.component }}:latest

      - name: Attest OCI image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.namespace }}/bracket-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
